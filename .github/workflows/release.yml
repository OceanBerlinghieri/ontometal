name: release
run-name: ${{ github.actor }} is releasing a version

on:
  workflow_dispatch:
    inputs:
      version:
        description: Ontology version to release
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Configure git identity
        run: |
          git config user.name "OceanBerlinghieri"
          git config user.email "OceanBerlinghieri@users.noreply.github.com"


      - name: Merge develop into master
        run: |
          git fetch origin master develop
          git checkout master
          git pull --ff-only origin master

          git merge --no-edit origin/develop || true

          if git diff --name-only --diff-filter=U | grep -q '^setup\.py$'; then
            git checkout --theirs setup.py
            git add setup.py
          fi

          if git diff --cached --quiet; then
            echo "No merge resolution needed"
          else
            git commit -m "Merge develop into master"
          fi

      - name: Update ontology version
        run: |
          python - <<'PY'
          import configparser
          from pathlib import Path

          version = "${{ github.event.inputs.version }}"
          path = Path("config/ontology_config.ini")
          config = configparser.ConfigParser()
          config.read(path)

          if not config.has_section("ONTOMETAL"):
              raise SystemExit("Missing [ONTOMETAL] section")

          config["ONTOMETAL"]["VERSION"] = version
          with path.open("w") as f:
              config.write(f)
          PY

          git add config/ontology_config.ini
          git commit -m "Bump ontology version to ${{ github.event.inputs.version }}" || true
          git push origin master

      - name: Create and push tag
        run: |
          TAG="v${{ github.event.inputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi
