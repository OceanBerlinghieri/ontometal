<h2 id="desc" class="list">OntoMetal: An Ontology for Metal Music: Description <span class="backlink"> back to <a href="#toc">ToC</a></span></h2>

<span class="markdown">This ontology is designed to represent the domain of metal music, including bands, albums, releases, and related concepts. It provides a structured framework for organizing and linking information about metal music entities.</span>
